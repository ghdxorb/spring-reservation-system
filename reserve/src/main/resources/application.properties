server.port=8081
spring.application.name=reserve

# ==========================================
# Oracle Database 설정
# ==========================================
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# XE 버전인 경우: jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=myuser
spring.datasource.password=1234

# JPA 설정 (Oracle 방언 지정 및 테이블 자동 생성)
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI 접속 경로 설정 (기본값: /swagger-ui/index.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# API 태그 및 메서드 정렬 (알파벳순)
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Controller 패키지 경로 지정 (원하는 패키지의 API만 노출)
springdoc.packages-to-scan=com.example.reserve.controller