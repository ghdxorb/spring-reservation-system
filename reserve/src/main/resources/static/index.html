<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예약 시스템 간이 프론트엔드</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        h3 { margin-top: 0; }
        input, button { padding: 8px; margin: 5px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .cancel-btn { background-color: #ff4d4f; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 5px 10px; }
        .cancel-btn:hover { background-color: #d9363e; }
        .canceled-text { color: #8c8c8c; text-decoration: line-through; }
    </style>
</head>
<body>

    <h2>📅 예약 관리 시스템</h2>

    <!-- 1. 유저 등록 -->
    <div class="card">
        <h3>1. 사용자 등록</h3>
        <input type="text" id="userName" placeholder="이름 (예: 홍길동)"><br>
        <button onclick="createUser()">유저 등록</button>
        <span id="userResult"></span>
    </div>

    <!-- 2. 아이템 등록 -->
    <div class="card">
        <h3>2. 예약 대상(아이템) 등록</h3>
        <input type="text" id="itemName" placeholder="아이템명 (예: 회의실A)"><br>
        <button onclick="createItem()">아이템 등록</button>
        <span id="itemResult"></span>
    </div>

    <!-- 3. 예약 신청 -->
    <div class="card">
        <h3>3. 예약 신청</h3>
        <input type="number" id="userId" placeholder="유저 ID (예: 1)"><br>
        <input type="number" id="itemId" placeholder="아이템 ID (예: 1)"><br>
        <input type="datetime-local" id="reserveDateTime"><br>
        <button onclick="createReservation()">예약하기</button>
        <span id="reserveResult"></span>
    </div>

    <!-- 4. 전체 예약 목록 & 취소 -->
    <div class="card">
        <h3>4. 전체 예약 현황</h3>
        <button onclick="loadReservations()">목록 새로고침</button>
        <table>
            <thead>
                <tr>
                    <th>예약 ID</th>
                    <th>유저 ID</th>
                    <th>아이템 ID</th>
                    <th>예약 일시</th>
                    <th>상태</th>
                    <th>작업</th>
                </tr>
            </thead>
            <tbody id="reservationTable"></tbody>
        </table>
    </div>

    <script>
        const API_BASE = "http://localhost:8081/api";

        // 유저 등록
        async function createUser() {
            const name = document.getElementById("userName").value;
            if (!name) return alert("이름을 입력하세요.");
            
            const res = await fetch(`${API_BASE}/users`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name })
            });
            const data = await res.json();
            document.getElementById("userResult").innerText = ` 등록 완료! (생성된 ID: ${data})`;
        }

        // 아이템 등록
        async function createItem() {
            const name = document.getElementById("itemName").value;
            if (!name) return alert("아이템명을 입력하세요.");

            const res = await fetch(`${API_BASE}/items`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name })
            });
            const data = await res.json();
            document.getElementById("itemResult").innerText = ` 등록 완료! (생성된 ID: ${data})`;
        }

        // 예약 등록
        async function createReservation() {
            const userId = document.getElementById("userId").value;
            const itemId = document.getElementById("itemId").value;
            const reserveDateTime = document.getElementById("reserveDateTime").value;

            if (!userId || !itemId || !reserveDateTime) {
                return alert("모든 필수 항목을 입력하세요.");
            }

            const res = await fetch(`${API_BASE}/reservations`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    userId: parseInt(userId),
                    itemId: parseInt(itemId),
                    reserveDateTime: reserveDateTime
                })
            });

            if (res.ok) {
                const data = await res.json();
                document.getElementById("reserveResult").innerText = ` 예약 성공! (예약 번호: ${data})`;
                loadReservations();
            } else {
                document.getElementById("reserveResult").innerText = "❌ 예약 실패 (중복 예약 또는 입력 오류)";
            }
        }

        // 예약 목록 조회
        async function loadReservations() {
            const res = await fetch(`${API_BASE}/reservations`);
            const data = await res.json();
            
            const tbody = document.getElementById("reservationTable");
            tbody.innerHTML = "";

            data.forEach(r => {
                const isCanceled = r.status === 'CANCELED';
                const statusText = isCanceled ? `<span class="canceled-text">취소됨</span>` : r.status;
                const actionButton = isCanceled 
                    ? '-' 
                    : `<button class="cancel-btn" onclick="cancelReservation(${r.id})">예약 취소</button>`;

                const row = `<tr>
                    <td>${r.id}</td>
                    <td>${r.user ? r.user.id : '-'}</td>
                    <td>${r.item ? r.item.id : '-'}</td>
                    <td>${r.reserveDateTime}</td>
                    <td>${statusText}</td>
                    <td>${actionButton}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // ⬇️ 예약 취소 API 호출 함수 추가
        async function cancelReservation(reservationId) {
            if (!confirm(`예약 ID ${reservationId}번을 정말 취소하시겠습니까?`)) {
                return;
            }

            const res = await fetch(`${API_BASE}/reservations/${reservationId}/cancel`, {
                method: "PATCH"
            });

            if (res.ok) {
                alert("예약이 정상적으로 취소되었습니다.");
                loadReservations(); // 목록 새로고침
            } else {
                alert("예약 취소에 실패했습니다.");
            }
        }

        // 페이지 로드 시 예약 목록 불러오기
        loadReservations();
    </script>
</body>
</html>
